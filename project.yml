name: Strata
options:
  bundleIdPrefix: com.lucascoupez
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
targets:
  Strata:
    type: application
    platform: macOS
    sources:
      - Sources
      - Resources
    dependencies:
      - target: yara
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lucascoupez.strata
        PRODUCT_NAME: Strata
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Strata
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: 1
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        ENABLE_HARDENED_RUNTIME: NO
        ENABLE_APP_SANDBOX: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_STRICT_CONCURRENCY: minimal
        COMBINE_HIDPI_IMAGES: YES
        SWIFT_INCLUDE_PATHS: ["$(SRCROOT)/Vendor/yara"]
        HEADER_SEARCH_PATHS: ["$(SRCROOT)/Vendor/yara/libyara/include"]
  yara:
    type: library.static
    platform: macOS
    sources:
      - path: Vendor/yara/libyara
        excludes:
          - "include/**"
    settings:
      base:
        HEADER_SEARCH_PATHS: ["$(SRCROOT)/Vendor/yara/libyara", "$(SRCROOT)/Vendor/yara/libyara/include"]
        GCC_PREPROCESSOR_DEFINITIONS: ["USE_NO_PROC", "HAVE_SCAN_PROC_IMPL=0", "HASH_MODULE", "HAVE_COMMONCRYPTO_COMMONCRYPTO_H", "BUCKETS_128=1", "CHECKSUM_1B=1"]
        GCC_WARN_INHIBIT_ALL_WARNINGS: YES
        CLANG_ENABLE_MODULES: NO
  StrataTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests
    dependencies:
      - target: Strata
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.lucascoupez.strata.tests
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Strata.app/Contents/MacOS/Strata"
        BUNDLE_LOADER: "$(TEST_HOST)"
        SWIFT_STRICT_CONCURRENCY: minimal
        SWIFT_INCLUDE_PATHS: ["$(SRCROOT)/Vendor/yara"]
        HEADER_SEARCH_PATHS: ["$(SRCROOT)/Vendor/yara/libyara/include"]
schemes:
  Strata:
    build:
      targets:
        Strata: all
    test:
      targets:
        - StrataTests
